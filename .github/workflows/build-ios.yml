
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Swift Executable & Package IPA
        run: |
          mkdir -p Payload/LowLeeApp.app
          
          # 1. Tạo file ViewController Swift bọc web
          cat << 'EOF' > ViewController.swift
          import UIKit
          import WebKit

          class ViewController: UIViewController {
              override func viewDidLoad() {
                  super.viewDidLoad()
                  let webView = WKWebView(frame: self.view.bounds)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  if let url = URL(string: "https://lowleevn.github.io/") {
                      webView.load(URLRequest(url: url))
                  }
                  self.view.addSubview(webView)
              }
          }

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = ViewController()
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # 2. Biên dịch trực tiếp file Swift thành file thực thi iOS
          xcrun -sdk iphoneos swiftc ViewController.swift -o Payload/LowLeeApp.app/LowLeeApp -target arm64-apple-ios15.0

          # 3. Tạo Info.plist
          cat << 'EOF' > Payload/LowLeeApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>LowLeeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.lowlee.app</string>
              <key>CFBundleName</key>
              <string>LowLeeApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          EOF

          # 4. Nén thành file .ipa
          zip -r MyWebApp.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: MyWebApp.ipa
