<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không Tìm Thấy Trang | Luxury Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --gold-gradient: linear-gradient(135deg, #f5d061 0%, #e6af2e 50%, #aa771c 100%);
            --text-primary: #f8f9fa;
            --text-secondary: #8a8f98;
            --accent-glow: radial-gradient(circle, rgba(230, 175, 46, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: var(--accent-glow);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Glassmorphism Card Container */
        .error-card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 60px 48px;
            max-width: 580px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .error-card:hover {
            border-color: rgba(230, 175, 46, 0.3);
        }

        /* Luxury 404 Typography */
        .error-code {
            font-family: 'Cinzel', serif;
            font-size: clamp(6rem, 15vw, 9rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 6px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            user-select: none;
        }

        .error-tag {
            display: inline-block;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 4px 14px;
            border-radius: 50px;
            margin-bottom: 24px;
            background: rgba(212, 175, 55, 0.05);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 36px;
            font-weight: 300;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--gold-gradient);
            color: #08080a;
            border: none;
            box-shadow: 0 4px 20px rgba(230, 175, 46, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230, 175, 46, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.03);
            transform: translateY(-2px);
        }

        /* Subtle Interactive Dot Matrix */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="ambient-glow" id="glow"></div>

    <main class="error-card" id="card">
        <div class="error-tag">Không Gian Trống</div>
        <div class="error-code">404</div>
        <h1>Tuyệt Tác Chưa Được Định Vị</h1>
        <p>Liên kết bạn yêu cầu có thể đã được chuyển dời hoặc không còn tồn tại trong kho lưu trữ độc bản này.</p>
        
        <div class="actions">
            <a href="/" class="btn btn-primary">Trang Chủ</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Quay Lại</a>
        </div>
    </main>

    <script>
        // Hiệu ứng tương tác ánh sáng theo con trỏ chuột
        const glow = document.getElementById('glow');
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            glow.style.left = `${clientX}px`;
            glow.style.top = `${clientY}px`;
            
            // Hiệu ứng nghiêng nhẹ thẻ 3D
            const xAxis = (window.innerWidth / 2 - clientX) / 45;
            const yAxis = (window.innerHeight / 2 - clientY) / 45;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body>
</html>
